hwdec=vaapi
save-position-on-quit=yes
volume = 50
osc=no

# Imagem (Intel UHD 620 em 1440p: ewa_* leva ~200 ms/quadro, pesado demais)
vo=gpu-next,gpu
scale=lanczos
cscale=lanczos
dscale=lanczos
scale-antiring=0.6
correct-downscaling=yes
deband=yes
deband-iterations=1
deband-threshold=32
deband-grain=8
dither-depth=auto
hls-bitrate=max

# Legenda (texto; ASS mantém o estilo próprio)
sub-font=Liberation Sans
sub-bold=yes
sub-font-size=64
sub-color="#FFFFFF"
sub-border-style=background-box
sub-back-color="#80000000"
sub-shadow-offset=8
sub-ass-override=scale
sub-auto=fuzzy
slang=pt-BR,pob,pt,por
