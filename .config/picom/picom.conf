# Picom: desfoque atrás do terminal (st) e dos pop-ups da barra (barpop); nos pop-ups também sombra, fade e cantos.
# No resto: sem sombra, fade, animação, opacidade ou cantos.
# O fundo do st já é translúcido (alpha 0.83 no config do st); o picom só desfoca o que fica atrás.

backend = "glx";
vsync = true;   # sem vsync, a saída de um terminal faz o outro piscar
use-damage = true;
log-level = "warn";

shadow = false;
fading = false;
corner-radius = 0;
frame-opacity = 1;

blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

detect-client-opacity = true;
detect-transient = true;
unredir-if-possible = false;  # true deixava a barra da tela 3 sobre o i3lock

# Pop-ups da barra (barpop): o picom desenha sombra suave, cantos arredondados e fade
# só nessas janelas. O resto continua sem sombra, sem fade e sem cantos.
shadow-radius = 22;
shadow-opacity = 0.55;
shadow-offset-x = -22;
shadow-offset-y = -14;
fade-in-step = 0.09;
fade-out-step = 0.12;
fade-delta = 8;
# Com "rules" o picom ignora as opções antigas de regra (blur-background-exclude,
# inactive-opacity etc.), então o "desfoca só o st" também mora aqui.
rules = (
  { match = "class_g != 'St'"; blur-background = false; },
  { match = "class_g = 'Barpop'"; shadow = true; fade = true; corner-radius = 14; blur-background = true; },
);
