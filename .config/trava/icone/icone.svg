<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a5c"/><stop offset=".55" stop-color="#10233a"/><stop offset="1" stop-color="#0b1626"/>
    </linearGradient>
    <radialGradient id="brilho" cx=".68" cy=".26" r=".55">
      <stop offset="0" stop-color="#ffcf5a" stop-opacity=".35"/><stop offset="1" stop-color="#ffcf5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffab2e"/>
    </linearGradient>
    <linearGradient id="nuvem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfdceb"/>
    </linearGradient>
    <linearGradient id="gota" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe3ff"/><stop offset="1" stop-color="#3a9be0"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#fundo)"/>
  <rect width="512" height="512" rx="112" fill="url(#brilho)"/>
  <!-- anéis de radar -->
  <g fill="none" stroke="#6cd1eb" stroke-opacity=".16" stroke-width="5">
    <circle cx="256" cy="268" r="150"/><circle cx="256" cy="268" r="210" stroke-dasharray="6 16"/>
  </g>
  <!-- sol -->
  <g transform="translate(330 168)">
    <g stroke="#ffc94d" stroke-width="13" stroke-linecap="round" opacity=".95">
      <line x1="0" y1="-98" x2="0" y2="-74"/><line x1="69" y1="-69" x2="52" y2="-52"/><line x1="98" y1="0" x2="74" y2="0"/>
      <line x1="-69" y1="-69" x2="-52" y2="-52"/><line x1="-98" y1="0" x2="-74" y2="0"/><line x1="69" y1="69" x2="52" y2="52"/>
    </g>
    <circle r="56" fill="url(#sol)"/>
  </g>
  <!-- nuvem -->
  <path filter="url(#sombra)" fill="url(#nuvem)"
    d="M150 330 h220 a62 62 0 0 0 0-124 a88 88 0 0 0-166-20 a70 70 0 0 0-54 144 z"/>
  <!-- gotas -->
  <g fill="url(#gota)">
    <path d="M196 368 q14 24 14 36 a14 14 0 0 1-28 0 q0-12 14-36z"/>
    <path d="M256 384 q14 24 14 36 a14 14 0 0 1-28 0 q0-12 14-36z"/>
    <path d="M316 368 q14 24 14 36 a14 14 0 0 1-28 0 q0-12 14-36z"/>
