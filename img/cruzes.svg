<svg width="1000" height="140" viewBox="0 0 1000 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Rodapé do README: faixa escura com granulado e listras (como capa de disco P&B) e ††† no meio. -->
  <defs>
    <filter id="grao" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.28"/>
      </feComponentTransfer>
    </filter>
    <pattern id="listras" width="9" height="140" patternUnits="userSpaceOnUse">
      <rect width="4" height="140" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <linearGradient id="bordas" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.82" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="some">
      <rect width="1000" height="140" fill="url(#bordas)"/>
    </mask>
    <filter id="brilho" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <g mask="url(#some)">
    <rect width="1000" height="140" fill="#060606"/>
    <rect width="1000" height="140" fill="url(#listras)"/>
    <rect width="1000" height="140" filter="url(#grao)"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="78" text-anchor="middle">
    <text x="500" y="98" fill="#e1e1e1" fill-opacity="0.35" filter="url(#brilho)">†††</text>
    <text x="500" y="98" fill="#f2f2f2">†††</text>
  </g>
</svg>
